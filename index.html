<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f9">
<title>MARKET INSIGHT</title>
<link rel="apple-touch-icon" href="./Stock_main.png">
<style>
*{box-sizing:border-box}
:root{--bg:#f3f5f9;--card:#fff;--line:#e6eaf1;--text:#202938;--muted:#929dad;--accent:#263e60;--green:#4ac18a;--tool:#f8f9fb;--tool-line:#edf0f4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a22;--card:#202733;--line:#303a49;--text:#edf1f6;--muted:#9aa6b8;--accent:#38577f;--tool:#202733;--tool-line:#303a49}}
:root[data-theme="dark"]{--bg:#151a22;--card:#202733;--line:#303a49;--text:#edf1f6;--muted:#9aa6b8;--accent:#38577f;--tool:#202733;--tool-line:#303a49}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:12px}
.app{max-width:850px;margin:auto;min-height:100vh}
header{height:61px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;gap:8px;align-items:center}
.brand i{width:4px;height:19px;background:var(--green);border-radius:4px}
.brand b{font-size:16px}
.brand small{display:block;font-size:8px;color:var(--muted);letter-spacing:.7px;margin-top:2px}
.tools button{border:1px solid var(--tool-line);background:var(--tool);border-radius:10px;width:32px;height:32px;color:var(--muted);font-size:14px;cursor:pointer}
main{padding:10px}
.intro{padding:15px;margin-bottom:9px}
.intro h2{font-size:17px;margin:0 0 4px}
.intro p{font-size:10px;color:var(--muted);margin:0}
.group{margin:14px 4px 7px;font-size:10px;font-weight:700;color:var(--muted)}
.group .ko{font-size:12px;margin-right:3px}
.list{display:grid;gap:7px}
a.link{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:0 2px 10px #26364f08;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
a.link:active{opacity:.65}
a.link:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.ico{flex:none;width:40px;height:40px;border-radius:11px;background:var(--tool);border:1px solid var(--tool-line);display:flex;align-items:center;justify-content:center;font-size:19px}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:14px}
.txt small{display:block;font-size:9px;color:var(--muted);margin-top:3px;letter-spacing:.5px}
.go{flex:none;font-size:20px;color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:18px 4px 0}
footer{text-align:center;color:var(--muted);font-size:8px;padding:18px 3px}
@media(min-width:600px){.list.two{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><i></i><div><b>마켓 인사이트</b><small>MARKET INSIGHT</small></div></div>
  <div class="tools"><button id="theme" type="button" aria-label="테마 전환">◐</button></div>
</header>
<main>
  <div class="group"><span class="ko">주식시장 분석</span> STOCK MARKET ANALYSIS</div>
  <nav class="list two" aria-label="주식시장 분석 페이지">
    <a class="link" href="https://k-stocks.github.io/c/"><span class="ico">🌅</span><span class="txt"><b>국내 증시 개장 전 분석</b><small>PRE-MARKET ANALYSIS</small></span><span class="go">›</span></a>
    <a class="link" href="https://k-stocks.github.io/t/"><span class="ico">📊</span><span class="txt"><b>시장 수급 분석</b><small>MARKET FLOW ANALYSIS</small></span><span class="go">›</span></a>
    <a class="link" href="https://k-stocks.github.io/st/"><span class="ico">🔥</span><span class="txt"><b>오늘의 주요 거래 종목</b><small>TODAY'S MOVERS</small></span><span class="go">›</span></a>
    <a class="link" href="https://k-stocks.github.io/s"><span class="ico">🔎</span><span class="txt"><b>종목 인사이트</b><small>STOCK INSIGHT</small></span><span class="go">›</span></a>
    <a class="link" href="https://k-stocks.github.io/n/"><span class="ico">📰</span><span class="txt"><b>월가 인사이트</b><small>WALL STREET INSIGHT</small></span><span class="go">›</span></a>
  </nav>

  <hr>
  <div class="group"><span class="ko">매크로 경제 분석</span> MACRO ANALYSIS</div>
  <nav class="list" aria-label="매크로 경제 분석 페이지">
    <a class="link" href="https://k-stocks.github.io/f/"><span class="ico">🏛️</span><span class="txt"><b>미국 경제지표 분석</b><small>US ECONOMIC INDICATORS ANALYSIS</small></span><span class="go">›</span></a>
  </nav>
</main>
<footer>투자 판단과 책임은 본인에게 있습니다.</footer>
</div>
<script>
(function(){
  var root=document.documentElement,btn=document.getElementById('theme');
  try{var t=localStorage.getItem('hub-theme');if(t)root.setAttribute('data-theme',t)}catch(e){}
  btn.addEventListener('click',function(){
    var dark=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);
    var next=dark?'light':'dark';
    root.setAttribute('data-theme',next);
    try{localStorage.setItem('hub-theme',next)}catch(e){}
  });
})();
</script>
</body>
</html>
